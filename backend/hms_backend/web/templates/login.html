{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Connexion</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex justify-center items-center h-screen">

  <div class="w-1/2 h-screen hidden lg:block">
    <img src="https://placehold.co/800x/667fff/ffffff.png?text=HMS+Login" alt="Image" class="object-cover w-full h-full">
  </div>

  <div class="lg:p-36 md:p-52 sm:p-20 p-8 w-full lg:w-1/2 bg-white rounded-2xl shadow-lg">
    <h1 class="text-2xl font-semibold mb-4">Connexion</h1>

    {% if messages %}
      {% for message in messages %}
        <p class="text-center text-{{ message.tags }}-600 mb-2">{{ message }}</p>
      {% endfor %}
    {% endif %}

    <form method="POST">
      {% csrf_token %}
      <div class="mb-4">
        <label for="username" class="block text-gray-600">Nom d'utilisateur</label>
        <input type="text" id="username" name="username" class="w-full border border-gray-300 rounded-md py-2 px-3 focus:outline-none focus:border-blue-500" autocomplete="off">
      </div>

      <div class="mb-4">
        <label for="password" class="block text-gray-600">Mot de passe</label>
        <input type="password" id="password" name="password" class="w-full border border-gray-300 rounded-md py-2 px-3 focus:outline-none focus:border-blue-500" autocomplete="off">
      </div>

      <button type="submit" class="bg-blue-500 hover:bg-blue-600 text-white font-semibold rounded-md py-2 px-4 w-full">
        Se connecter
      </button>
    </form>

    <div class="mt-6 text-blue-500 text-center">
      <a href="{% url 'register' %}" class="hover:underline">Pas encore de compte ? Inscrivez-vous ici</a>
    </div>
  </div>
</body>
</html>
