{% extends 'base.html' %}
{% block title %}Modifier rendez-vous{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto bg-white p-8 rounded-2xl shadow-xl">
  <h2 class="text-2xl font-bold mb-6">Modifier le rendez-vous</h2>

  {% if messages %}
    {% for message in messages %}
      <div class="mb-4 p-3 rounded-lg
        {% if message.tags == 'error' %}bg-red-100 text-red-700{% else %}bg-green-100 text-green-700{% endif %}">
        {{ message }}
      </div>
    {% endfor %}
  {% endif %}

  <form method="post">
    {% csrf_token %}

    <label class="block mb-2 font-semibold">Docteur</label>
    <input type="text" value="{{ appointment.doctor_name }}" disabled
           class="w-full mb-4 p-2 border rounded bg-gray-100">

    <label class="block mb-2 font-semibold">Date</label>
    <input type="date" name="date" value="{{ appointment.date|date:'Y-m-d' }}" required
           class="w-full mb-4 p-2 border rounded">

    <label class="block mb-2 font-semibold">Heure</label>
    <input type="time" name="time" value="{{ appointment.time|time:'H:i' }}" required
           class="w-full mb-4 p-2 border rounded">

    <label class="block mb-2 font-semibold">Motif</label>
    <textarea name="reason" required class="w-full mb-4 p-2 border rounded">{{ appointment.reason }}</textarea>

    <button type="submit" class="bg-indigo-600 text-white px-6 py-2 rounded hover:bg-indigo-700">
      Enregistrer
    </button>
    <a href="{% url 'patient_dashboard' %}" class="ml-4 text-gray-600 hover:underline">Annuler</a>
  </form>
</div>
{% endblock %}
