{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Dashboard{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="https://placehold.co/32x32/00b894/ffffff.png?text=H">
</head>
<body class="bg-gray-100 flex">

  <!-- 🧭 SIDEBAR -->
  <aside class="w-64 bg-white h-screen shadow-xl fixed flex flex-col justify-between">
    <div>
      <div class="p-6 border-b border-gray-200">
        <h1 class="text-2xl font-bold text-green-600">HMS</h1>
        <p class="text-sm text-gray-500">Hospital Management</p>
      </div>

      <nav class="mt-6 space-y-2 px-4">
        {% block sidebar %}
        <!-- Les liens spécifiques à chaque rôle iront ici -->
        {% endblock %}
      </nav>
    </div>

    <div class="p-4 border-t border-gray-200">
      <a href="{% url 'logout' %}" class="block w-full text-center bg-red-500 hover:bg-red-600 text-white py-2 rounded-lg">Déconnexion</a>
    </div>
  </aside>

  <!-- 🧱 CONTENU PRINCIPAL -->
  <main class="flex-1 ml-64 p-8">
    <header class="flex justify-between items-center mb-8">
      <h2 class="text-3xl font-semibold text-gray-800">{% block header %}{% endblock %}</h2>
      <div class="text-gray-500 text-sm">
        Connecté en tant que <span class="font-semibold text-green-600">{{ username }}</span>
      </div>
    </header>

    {% block content %}
    {% endblock %}
  </main>
</body>
</html>
