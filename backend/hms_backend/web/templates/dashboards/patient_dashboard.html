{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Patient</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <div class="max-w-3xl mx-auto mt-12 bg-white p-6 rounded-2xl shadow-lg">
        <h1 class="text-2xl font-bold text-gray-700 mb-4">
            👋 Bienvenue, {{ username }} !
        </h1>
        <p class="text-gray-600 mb-6">
            Vous êtes connecté en tant que <strong>Patient</strong>.
        </p>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <a href="#" class="bg-blue-500 text-white p-4 rounded-lg hover:bg-blue-600 transition">
                📋 Voir mes rendez-vous
            </a>
            <a href="#" class="bg-green-500 text-white p-4 rounded-lg hover:bg-green-600 transition">
                💊 Voir mes prescriptions
            </a>
            <a href="#" class="bg-purple-500 text-white p-4 rounded-lg hover:bg-purple-600 transition">
                🩺 Contacter un docteur
            </a>
            <a href="{% url 'logout' %}" class="bg-red-500 text-white p-4 rounded-lg hover:bg-red-600 transition">
                🚪 Déconnexion
            </a>
        </div>
    </div>
</body>
</html>
